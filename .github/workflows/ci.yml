name: CI

on:
  push:
    branches: [main, solution]
  pull_request:
    branches: [main]

# workflow-level variables — shared across all jobs
env:
  IMAGE_NAME: gists-api
  PYTHON_VERSION: "3.12"

jobs:
  test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -v

  build-and-deploy:
    needs: test
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .
          docker tag ${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ env.IMAGE_NAME }}:latest

      - name: Smoke test
        run: |
          docker run -d -p 8080:8080 --name smoke-test ${{ env.IMAGE_NAME }}:${{ github.sha }}
          sleep 3
          curl -f http://localhost:8080/healthz
          docker stop smoke-test && docker rm smoke-test

      - name: Deploy to local Kubernetes
        run: |
          kubectl apply -f k8s/
          kubectl rollout status deployment/gists-api --timeout=60s
